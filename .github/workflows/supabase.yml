name: Desplega Supabase (BD + funcions)
# Opcional. Necessita els secrets del repo SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF i SUPABASE_DB_PASSWORD.
on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Comprova secrets
        id: chk
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "Falten secrets de Supabase: no es desplega."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.skip != 'true'
      - uses: supabase/setup-cli@v1
        if: steps.chk.outputs.skip != 'true'
        with:
          version: latest
      - if: steps.chk.outputs.skip != 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push
          supabase functions deploy --project-ref "$PROJECT_REF"
